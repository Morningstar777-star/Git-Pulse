name: Central Database Sync & Crawler

on:
  schedule:
    # Run automatically every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions UI

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Intelligent Crawler & Synchronize Database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python backend/app/ingestion.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gitpulse.db
          
          # Only commit if there are actual database changes
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-sync central trending database [skip ci]"
            # Rebase against any recent commits before pushing
            git pull --rebase origin main || true
            git push origin main
          else
            echo "Database is already up to date. No changes to commit."
          fi
